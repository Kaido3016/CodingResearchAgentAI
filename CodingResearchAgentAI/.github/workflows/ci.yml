name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advanced-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodingResearchAgentAI/advanced-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests main.py
      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing

  simple-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodingResearchAgentAI/simple-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Compile
        run: uv run python -m py_compile main.py
